// ez2/vr/hl2bodyvr/cfg/vr_body.cfg — body-presence posture for EZ2 VR.
//
// LAYER: hl2bodyvr (full-body presence). Staged to <depot>/vr/hl2bodyvr and
// mounted on GAME via VR_CONTENT_PATH. Runs from ez2vr_boot.cfg.
//
// WHAT THIS LAYER IS TODAY: one real pin + documentation. A visible
// first-person body (torso/arms matching the tracked hands) needs body models
// and IK code that do not exist in this build yet — and this file does not
// pretend otherwise. What it DOES pin:
//
//   - Corpses collide (cl_ragdoll_collide, game/client/physics.cpp). A body
//     layer with interpenetrating ragdolls looks broken the moment EZ2's
//     squad fights pile bodies; pairs with the 1 in ez2vr_boot.cfg.
//
// DELIBERATELY ABSENT:
//   - Third-person camera framing (cam_idealdist etc. in game/client/in_camera.cpp
//     are FCVAR_CHEAT and default 150/0/0). A body-debug `thirdperson` view is a
//     sv_cheats test affordance, not a boot pin: pinning a cheat convar here
//     would print a cheat warning on every normal boot. Frame the test view by
//     hand when you need it.
//   - Footstep audio: there is no footstep_sounds convar in this tree (verified),
//     and HL2 footstep defaults are already correct. Nothing to pin.
//
// No vr_* keys from any other VR fork; no ez2vr_* menu-owned keys.
cl_ragdoll_collide 1

// Proves the layer execs (successful execs are otherwise silent in the log).
echo "[ez2vr] vr_body.cfg active (hl2bodyvr layer)"
