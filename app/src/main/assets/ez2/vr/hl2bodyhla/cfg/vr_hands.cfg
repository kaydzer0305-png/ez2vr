// ez2/vr/hl2bodyhla/cfg/vr_hands.cfg — hand/interaction posture for EZ2 VR.
//
// LAYER: hl2bodyhla (HLA-style hands). Staged to <depot>/vr/hl2bodyhla and
// mounted on GAME via VR_CONTENT_PATH. Runs from ez2vr_boot.cfg.
//
// WHAT THIS LAYER IS TODAY: status-quo pins + documentation, same story as
// vr_body.cfg. Tracked-hand meshes and finger IK do not exist in this build
// yet. What exists and is pinned here are the gravity-gun defaults EZ2's Bad
// Cop kit leans on in the early chapters, stated at their compiled defaults
// (game/server/hl2/weapon_physcannon.cpp) so a future hand-tuning pass has one
// place to change them. Names verified — physcannon_pullforce (not
// physcannon_pull_force) and friends; there is no tractbeam_radius convar.
//
// No vr_* keys from any other VR fork; no ez2vr_* menu-owned keys.
physcannon_pullforce 4000
physcannon_maxmass 250
physcannon_cone 0.97
physcannon_tracelength 250

# Proves the layer execs (successful execs are otherwise silent in the log).
echo "[ez2vr] vr_hands.cfg active (hl2bodyhla layer)"
