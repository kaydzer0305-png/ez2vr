// ez2/vr/hl2vr/cfg/vr_core.cfg — core stereo/HUD/viewmodel posture for EZ2 VR.
//
// LAYER: hl2vr (core). Staged to <depot>/vr/hl2vr, mounted on the engine's GAME
// search path via VR_CONTENT_PATH (see filesystem_init.cpp). Runs from
// ez2vr_boot.cfg AFTER config.cfg, so player archive values load first and this
// file only pins what VR needs to be true on Quest.
//
// RULES (same as ez2vr_boot.cfg):
//   - Standard Source 2013 / Mapbase convars ONLY, verified against
//     game/client + game/server in this tree. A row that does not exist prints
//     "unknown command" at every boot; a row that differs from the default on
//     a cheat-flagged convar prints a cheat warning. Both are boot spew, so
//     every row below is an existing, settable convar at its status-quo value
//     unless the comment says otherwise.
//   - The ez2vr_* keys owned by the VR Settings menu are NOT repeated here (the
//     menu appends them as +convar pairs AFTER the overlay cfgs, so player
//     choice always wins). See EZ2VrSettings.java.

// --- viewmodel: the desktop FOV (54) is kept. There are no viewmodel_offset_*
// --- convars in this engine (verified: only viewmodel_fov exists in
// --- game/client/view.cpp), so muzzle placement is documented here, not
// --- pinned: a future viewmodel-offset backplane owns it.
viewmodel_fov 54

// --- HUD: keep it drawn and glanceable. Quickinfo (the aux-power readout)
// --- matters more in VR because the HEV suit light is primary feedback with
// --- no keyboard legend on screen. Both exist (hud_crosshair.cpp,
// --- hud_quickinfo.cpp) and are FCVAR_ARCHIVE, so same-value sets are silent.
hud_quickinfo 1
crosshair 1

// --- headbob: the head IS tracked 1:1, so view bob is pure motion sickness.
// --- cl_bob/cl_bobup exist (basehlcombatweapon_shared.cpp, no cheat flag).
// --- Amplitude 0 kills the bob with no divide-by-zero risk (cl_bobcycle is
// --- deliberately NOT zeroed — it is a cycle period used as a divisor).
cl_bob 0
cl_bobup 0

// Proves the layer execs (successful execs are otherwise silent in the log).
echo "[ez2vr] vr_core.cfg active (hl2vr layer)"
