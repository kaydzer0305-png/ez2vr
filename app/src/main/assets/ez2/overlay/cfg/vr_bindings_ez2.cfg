// ez2/overlay/cfg/vr_bindings_ez2.cfg — Bad Cop arsenal layout for EZ2.
//
// OPT-IN, never auto-executed. Binds are player settings (they archive into
// config.cfg like menu choices), so no boot file may own them — adopting this
// layout is one console line, once:
//
//   exec vr_bindings_ez2.cfg
//
// After that the archive keeps them and this file is never needed again (until
// a reset). Resolves from the overlay (EXTRAS_VPK_PATH), so it works on both
// boot paths with no engine change.
//
// SECTION 1 (active): keyboard fallback for the full EZ2 arsenal, in slot
// order. Entity names verified against the EZ2 reference tree (weapon_*.cpp +
// GiveNamedItem/ClassMatches strings). `use` with a weapon the current Quest
// build lacks prints one line and keeps the bind — harmless, and it starts
// working the moment the weapon's DLL lands (M3 roster expansion). Two names
// seen in older loadouts but NOT found in this tree (weapon_ar1,
// weapon_flaregun) are deliberately absent: append them to lines 3/5 yourself
// if your install provides them.
//
//   melee ......... crowbar / stunstick
//   sidearms ...... displacer pistol (EZ2), pulse pistol (EZ2), 357
//   automatics .... smg1, smg2, oicw (EZ2), ar2_proto (EZ2)
//   heavy ......... shotgun, crossbow, physcannon
//   thrown ........ frag, hopwire, slam
bind "1" "use weapon_crowbar; use weapon_stunstick"
bind "2" "use weapon_displacer_pistol; use weapon_pulsepistol; use weapon_357"
bind "3" "use weapon_smg1; use weapon_smg2; use weapon_oicw; use weapon_ar2_proto"
bind "4" "use weapon_shotgun; use weapon_crossbow; use weapon_physcannon"
bind "5" "use weapon_frag; use weapon_hopwire"
bind "6" "use weapon_slam"
bind "r" "+reload"
bind "e" "+use"
bind "g" "impulse 101"
echo "[ez2vr] vr_bindings_ez2.cfg adopted (Bad Cop arsenal layout)"

// SECTION 2 (documentation, not commands): VR action mapping. The OpenXR
// action set lives in launcher/android/vr_input.cpp (Quest Touch profile;
// trigger and squeeze are floats, so presses are thresholds). The command
// mapping is launcher/android/ezquest_vr_sourceinput.cpp, EZ2 profile only
// (SOURCEVR_GAME=EntropyZero2). EZ1 keeps its own chord layout.
//
// Locomotion reads ez2vr_locomotion_mode live (0 smooth +move, 1 teleport
// blink via ez2vr_blink ~96 units, 2 dash blink ~192 units plus a shove).
// Turn reads ez2vr_turn_mode (0 snap at ez2vr_turn_snap_angle, 1 smooth).
// Teleport/dash are on-foot only; a vehicle ignores ez2vr_blink, so drive
// the APC in smooth mode. impulse 101 is sv_cheats-gated, same as the "g"
// key above. Right-stick click is impulse 100 (flashlight), which is not.
//
//   right trigger .... +attack (current weapon)
//   right grip ....... +attack2 (alt-fire: OICW grenade, SMG2 burst, physcannon punt)
//   left trigger ..... +use (grab / interact at arm's length)
//   left grip ........ +reload
//   right A .......... slot-cycle next arsenal group (1-6 order above)
//   right B .......... impulse 101 (all weapons, panic key)
//   left X ........... lastinv (previous weapon)
//   left Y ........... +showscores (visor squad status while held; pairs with
//                      ez2vr_visor_overlay)
//   left stick ....... locomotion per ez2vr_locomotion_mode (smooth/teleport/dash)
//   right stick ...... turn per ez2vr_turn_mode (snap/smooth)
//   right stick click  toggle flashlight (pairs with ez2vr_flashlight_mount)
