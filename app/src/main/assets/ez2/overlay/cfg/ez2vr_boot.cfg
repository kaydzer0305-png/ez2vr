// ez2/overlay/cfg/ez2vr_boot.cfg — Quest boot baseline for Entropy: Zero 2.
//
// Exec order (our launcher): config.cfg (player archive) is read by the engine
// first, then this file runs once at startup via the launch argv
// (+exec ez2vr_boot.cfg). Per-map and chapter cfgs run later and win.
//
// RULE borrowed from hard experience: nothing here may own a setting the
// player can change in a menu. Boot files pin the status quo for Quest;
// menus own player choice. Retail chapter/skill cfgs (chapter*.cfg,
// skill*.cfg, skill_manifest.cfg) are NEVER written here.
//
// Engine coverage: standard Source 2013 / Mapbase convars only. No vr_* keys
// from any other VR fork — those convars do not exist in this engine build
// and would only print "unknown command" spew at boot.

// --- frame pacing: let XR own vsync, never the engine ---
fps_max 0
mat_vsync 0
engine_no_focus_sleep 0

// --- VR-hostile smoothing off (head-tracked view must be 1:1) ---
cl_smooth 0
cl_smoothtime 0

// --- preloading: Quest storage is fast, hitches are not acceptable ---
cl_forcepreload 1
sv_forcepreload 1

// --- audio: async mix, no focus-ducking (losing focus pauses via XR anyway) ---
snd_mix_async 1
snd_noextraupdate 1
snd_mute_losefocus 0
snd_mixahead 0.1
snd_async_fullyasync 1

// --- texture streaming posture for 6GB shared-memory headsets ---
mat_forcemanagedtextureintohardware 1

// --- water: EZ2 has arctic canals and reflective interiors; cheap water first,
// --- player can raise it later once Mapbase water VR cost is measured ---
r_waterforceexpensive 0
r_waterforcereflectentities 0
r_WaterDrawReflection 1
r_WaterDrawRefraction 1

// --- HDR: ship the compiled default (1). Level 2 doubles lightmap texels and
// --- is a look change, not a free win — measure on EZ2's arctic maps first ---
mat_hdr_level 1
mat_bloomscale 0.5

// --- shadows: stencil off, single depth texture; flashlight shadows stay on
// --- (Ravenholm-style torch is core EZ2 atmosphere) ---
r_shadows 1
r_shadowrendertotexture 1
r_flashlightdepthtexture 1

// --- EZ2 squad battles are AI-heavy: keep full think by default, tune later ---
ai_default_efficient 0
ai_strong_optimizations 0

// --- ragdolls collide by default (EZ2's Combine-vs-rebel fights pile bodies) ---
cl_ragdoll_collide 1

// --- VR layers (hl2vr / hl2bodyvr / hl2bodyhla). Each ships one cfg stating
// --- the posture its future models need; they resolve through VR_CONTENT_PATH
// --- once the engine mounts the staged layers as GAME search paths (see
// --- filesystem_init.cpp). Order: core first, then body, then hands, so a key
// --- set in more than one layer ends with the most specific layer winning.
// --- On an engine that does not mount the layers yet each line is one
// --- "couldn't exec" warning, not a failure.
exec vr_core.cfg
exec vr_body.cfg
exec vr_hands.cfg
