// ez2/overlay/cfg/vr_defaults.cfg — compiled defaults for the ez2vr_* keys, as DATA.
//
// Every value below equals the compiled default in the VR layer; this file
// states them, it does not change them. It is NOT auto-executed: config.cfg
// (player archive) loads first, and exec'ing this after it would wipe the
// player's saved comfort settings every launch. The in-game VR Settings menu
// owns these values; this file is the catalog a "reset to defaults" reads.
//
// Namespace note: ez2vr_* is OURS. No vr_*/hlvr_* keys from other forks are
// referenced — those convars do not exist in this engine build.

// --- locomotion ---
// ez2vr_locomotion_mode              0   // 0 smooth, 1 teleport, 2 teleport+dash
// ez2vr_move_speed_scale             0.7
// ez2vr_sprint_floor                 0.85
// ez2vr_turn_mode                    0   // 0 snap, 1 smooth
// ez2vr_turn_snap_angle              30
// ez2vr_vignette_inner               0.4
// ez2vr_vignette_outer               0.7
// ez2vr_vignette_walk_opacity        0.5
// ez2vr_vignette_vehicle_opacity     0.5
// ez2vr_seated                       0

// --- hud / view ---
// ez2vr_hud_distance                 47.24
// ez2vr_hud_in_world                 1
// ez2vr_viewmodel_offset_forward    -8
// ez2vr_world_scale                  1.0
// ez2vr_headbob                      0

// --- hands / interaction ---
// ez2vr_handedness                   0   // 0 right, 1 left
// ez2vr_grip_threshold               0.6
// ez2vr_gunpoint                     1
// ez2vr_gunpoint_range               480.0
// ez2vr_menu_laser_width             0.30

// --- EZ2 Bad Cop kit ---
// ez2vr_visor_overlay                1   // combine visor chrome + squad status
// ez2vr_nightvision_fov              110.0
// ez2vr_flashlight_mount             0   // 0 hand, 1 head
// ez2vr_flashlight_toggle            1

// --- APC / vehicle (arctic campaign) ---
// ez2vr_vehicle_aim_mode             0   // 0 head-aim, 1 hand-aim
// ez2vr_vehicle_vignette             1

// --- audio volumes ---
// ez2vr_volume_weapons               1.0
// ez2vr_volume_effects               1.0
// ez2vr_volume_voice                 1.0
// ez2vr_volume_ambience              1.0

// --- performance posture (menu-owned; see ez2vr_mobile.cfg for levers) ---
// ez2vr_performance_mode             0   // 0 quality, 1 balanced, 2 performance
// ez2vr_ffr_level                    0   // 0 off .. 3 max, XR foveation
// ez2vr_refresh_request              90

// --- the same table, as executable commands (for explicit reset only) ---
ez2vr_locomotion_mode "0"
ez2vr_move_speed_scale "0.7"
ez2vr_sprint_floor "0.85"
ez2vr_turn_mode "0"
ez2vr_turn_snap_angle "30"
ez2vr_vignette_inner "0.4"
ez2vr_vignette_outer "0.7"
ez2vr_vignette_walk_opacity "0.5"
ez2vr_vignette_vehicle_opacity "0.5"
ez2vr_seated "0"
ez2vr_hud_distance "47.24"
ez2vr_hud_in_world "1"
ez2vr_viewmodel_offset_forward "-8"
ez2vr_world_scale "1.0"
ez2vr_headbob "0"
ez2vr_handedness "0"
ez2vr_grip_threshold "0.6"
ez2vr_gunpoint "1"
ez2vr_gunpoint_range "480.0"
ez2vr_menu_laser_width "0.30"
ez2vr_visor_overlay "1"
ez2vr_nightvision_fov "110.0"
ez2vr_flashlight_mount "0"
ez2vr_flashlight_toggle "1"
ez2vr_vehicle_aim_mode "0"
ez2vr_vehicle_vignette "1"
ez2vr_volume_weapons "1.0"
ez2vr_volume_effects "1.0"
ez2vr_volume_voice "1.0"
ez2vr_volume_ambience "1.0"
ez2vr_performance_mode "0"
ez2vr_ffr_level "0"
ez2vr_refresh_request "90"
