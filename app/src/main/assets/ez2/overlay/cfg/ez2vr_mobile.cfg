// ez2/overlay/cfg/ez2vr_mobile.cfg — Quest performance posture, OPT-IN.
//
// Runs at every new game (GameInit) AFTER config.cfg, so an ACTIVE row here
// would stomp the player's saved menu choice on every map load. Therefore:
// every row that lowers visual or gameplay quality ships COMMENTED. Delete the
// leading // to opt in. The few ACTIVE rows at the bottom are status-quo pins
// that change nothing.
//
// Each toggle names its cost and expected win. Measure on EZ2's maps
// (arctic APC run, Arbeit interiors, squad firefights) before enabling.

// --- fill rate ---
// Cost: cheaper shader fallbacks on some world/model materials.
// Win: pixel-shader fill, usually the biggest Quest lever.
//mat_reducefillrate 1

// --- legacy particles (smoke stacks, AR2-style explosions) ---
// Cost: thinner smoke/explosion/dust systems.
// Win: overdraw + particle CPU in big fights.
//mat_reduceparticles 1

// --- bone setup: EZ2 fields many Combine at once ---
// Cost: models past 400u reuse bones every other frame (subtle ghosting risk).
// Win: bone-setup CPU, typically #2 behind fill.
//cl_reduced_bone_setup_dist 400

// --- detail props ---
// Cost: grass/rubble pop-in closer (1200 -> 800).
// Win: vertex + draw calls on vistas. A/B the arctic wastes first.
//cl_detaildist 800

// --- ragdoll collisions (pairs with the 1 in ez2vr_boot.cfg) ---
// Cost: corpses interpenetrate.
// Win: ragdoll physics CPU in squad wipeouts.
//cl_ragdoll_collide 0

// --- flashlight shadows (EZ2 look decision, not just perf) ---
// Cost: torch stops casting real-time shadows.
// Win: shadow-depth pass. Keep ON until Ravenholm-equivalent maps are measured.
//r_flashlightdepthtexture 0

// --- AI think (EZ2 runs squad AI: player + allies + enemies) ---
// Cost: distant NPCs react slightly later.
// Win: AI think CPU in multi-squad battles. Enable only if profiling says so.
//ai_default_efficient 1
//ai_strong_optimizations 1

// --- helicopter/chopper-style burst tuning (if EZ2 reuses the chopper base) ---
// Cost: lighter-feeling gunship fights (fewer rounds per burst).
// Win: traced-shot + tracer + impact CPU.
//sk_helicopter_roundsperburst 2
//sk_helicopter_burstcount 8

// ---------------------------------------------------------------- ACTIVE PINS
// Defensive pins only: hold the status quo against stale config.cfg values.
// Color correction has no VR path in this build; pin it off.
mat_colorcorrection 0
