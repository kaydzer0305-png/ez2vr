# Gradle settings for the EZ2 VR launcher.

# androidx.documentfile (DocumentFile) is used by DocumentFileNode, so the
# AndroidX namespace must be enabled or AGP fails checkDebugAarMetadata.
android.useAndroidX=true

# The launcher declares no resources of its own (all UI is built in code), so
# only the app's own classes need to stay in the non-final R.
android.nonTransitiveRClass=true

# Default heap for the Gradle daemon. AGP's manifest/resource tasks are the
# memory-hungry ones; 2g is comfortable for a single-module launcher.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

org.gradle.parallel=true
org.gradle.caching=true
